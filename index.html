<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bfrontend</title>
<meta name="description" content="bfrontend — 前端工程师，Vue / React / Angular / 跨端 / Electron">
<style>
  :root { color-scheme: dark; --bg:#0b0f0e; --fg:#e8f2ee; --muted:#8ea3a0; --accent:#7ef0c3; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #123 0%, var(--bg) 60%);
    color: var(--fg);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: grid; place-items: center; padding: 40px 24px;
  }
  main { max-width: 620px; width: 100%; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display:inline-block; margin-right: 10px; box-shadow: 0 0 14px var(--accent); }
  .eyebrow { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: clamp(38px, 9vw, 68px); line-height: 1.05; letter-spacing: -.02em; margin: 18px 0 10px; }
  h1 span { color: var(--accent); }
  p.lead { color: var(--muted); font-size: 17px; margin: 0 0 28px; }
  ul.stack { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0 0 32px; }
  ul.stack li { border: 1px solid #1e2b28; background: #0f1614; color: #cfe6df; font-size: 13px; padding: 6px 12px; border-radius: 999px; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; }
  a { color: inherit; text-decoration: none; }
  .btn { border: 1px solid #24403a; padding: 10px 18px; border-radius: 10px; font-size: 14px; transition: border-color .2s, background .2s; }
  .btn:hover { border-color: var(--accent); background: #10201b; }
  .btn.primary { background: var(--accent); color: #06110d; border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.06); }
  footer { margin-top: 44px; font-size: 13px; color: #5d7370; border-top: 1px solid #16201e; padding-top: 16px; }
  footer a { color: #9fc4bb; border-bottom: 1px dotted #33514a; }
</style>
</head>
<body>
<main>
  <div class="eyebrow"><span class="dot"></span>bfrontend.loc.cc</div>
  <h1>你好，我是<br><span>bfrontend</span>。</h1>
  <p class="lead">前端工程师，自由职业。做 Web、跨端、桌面端与 Node 服务。</p>
  <ul class="stack">
    <li>Vue</li><li>React</li><li>Angular</li><li>微信小程序</li><li>跨端 App</li><li>Electron</li><li>Node</li>
  </ul>
  <div class="links">
    <a class="btn primary" href="https://github.com/bfrontend">GitHub</a>
    <a class="btn" href="mailto:hello@bfrontend.loc.cc">Email</a>
  </div>
  <footer>
    这个页面挂在 <a href="https://bfrontend.loc.cc">bfrontend.loc.cc</a> · 由 GitHub Pages 托管
  </footer>
</main>
</body>
</html>
